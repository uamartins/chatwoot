# uam: ambiente das specs do fork, sem enterprise/. Usado por bin/uam-spec.
name: uam-spec
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ''
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres]
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 30
  app:
    build: .
    image: uam-spec-app:3.4.4
    working_dir: /src
    environment:
      RAILS_ENV: test
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ''
      REDIS_URL: redis://redis:6379
      BUNDLE_PATH: /bundle
      BUNDLE_JOBS: '8'
      NODE_OPTIONS: --openssl-legacy-provider
    volumes:
      - src:/src
      - bundle:/bundle
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  src:
  bundle:
